name: Agent Production QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-production-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Wait for production deployment
        shell: bash
        run: |
          for i in {1..30}; do
            BODY=$(curl -fsS https://exchange.rematcher.co.il/api/health || true)
            echo "health[$i]=$BODY"
            if echo "$BODY" | grep -q "${GITHUB_SHA}"; then
              echo "Production is on ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach ${GITHUB_SHA} in time"
          exit 1
      - name: Production Agent smoke
        run: npx tsx scripts/agent-v2-smoke.ts
