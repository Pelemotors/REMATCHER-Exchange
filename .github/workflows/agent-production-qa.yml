name: Agent Production QA

# Production conversation regression check for changes that can affect the Exchange Agent.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-production-qa.yml'
      - 'src/services/assistant/**'
      - 'src/config/product.ts'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'scripts/agent-hard-safety-qa.ts'
      - 'scripts/agent-judgment-eval.ts'
      - 'scripts/agent-dealer-memory-qa.ts'
      - 'scripts/privacy-ai-v1-production-qa.ts'
      - 'scripts/agent-commercial-production-qa.ts'
      - 'scripts/agent-v2-smoke.ts'
      - 'src/services/privacy/**'
      - 'src/config/legal/**'
      - 'content/legal/**'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Wait for production deployment
        shell: bash
        run: |
          for i in {1..30}; do
            BODY=$(curl -fsS https://exchange.rematcher.co.il/api/health || true)
            echo "health[$i]=$BODY"
            if echo "$BODY" | grep -q "${GITHUB_SHA}"; then
              echo "Production is on ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach ${GITHUB_SHA} in time"
          exit 1
      - name: Load existing pilot QA credentials
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('scripts/agent-v2-smoke.ts', 'utf8');
          const email = src.match(/const EMAIL = process\.env\.E2E_EMAIL \?\? "([^"]+)"/)?.[1];
          const password = src.match(/const PASSWORD = process\.env\.E2E_PASSWORD \?\? "([^"]+)"/)?.[1];
          if (!email || !password) throw new Error('Pilot QA credentials not found');
          console.log(`::add-mask::${password}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `E2E_EMAIL=${email}\nE2E_PASSWORD=${password}\n`);
          NODE
      - name: Hard Safety Production QA
        run: npx tsx scripts/agent-hard-safety-qa.ts
      - name: Privacy & AI v1 Production QA
        run: npx tsx scripts/privacy-ai-v1-production-qa.ts
      - name: Dealer Memory Production QA
        run: npx tsx scripts/agent-dealer-memory-qa.ts
      - name: Judgment evaluation (non-blocking)
        continue-on-error: true
        run: npx tsx scripts/agent-judgment-eval.ts
