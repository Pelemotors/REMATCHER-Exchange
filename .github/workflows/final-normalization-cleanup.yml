name: Final Normalization Cleanup

on:
  push:
    branches: [feat/final-ai-normalization-cleanup]

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-ai-normalization-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final Agent/import product cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('src/services/assistant/agent-tools.ts')
          s = p.read_text()
          s = re.sub(
            r'"Update the CURRENT conversational inventory draft with structured vehicle facts you understood from the user.s message\.[^"]*Do not invent model/year/mileage/price\."',
            '"Update the CURRENT conversational inventory draft with structured vehicle facts you understood from the user message. Conversation state only — does NOT write to the database and does NOT require confirmation. Use for initial facts AND follow-up corrections such as also has 4x4. Product semantics have ONE seller price: asking price. For features, use only canonical feature identifiers from the product vocabulary. Only include facts actually stated or clearly corrected."',
            s,
            count=1,
          )
          s, n = re.subn(
            r'(\s+ownershipHand: nullableNumber,\n\s+ownershipType: nullableString,\n)\s+retailPrice: nullableNumber,\n\s+b2bPrice: nullableNumber,\n\s+region: nullableString,',
            r'\1            b2bPrice: nullableNumber,\n            region: nullableString,\n            fuelType: nullableString,\n            engineDisplacementCc: nullableNumber,\n            features: {\n              type: ["array", "null"],\n              items: { type: "string" },\n            },',
            s,
            count=1,
          )
          if n != 1:
              raise SystemExit('agent-tools inventory draft schema replacement failed')
          p.write_text(s)

          p = Path('src/services/inventory/import.ts')
          s = p.read_text().replace(
            'מחיר סוחר חסר — לא תיווצר התאמה סופית עד שיושלם',
            'מחיר מבוקש חסר — לא תיווצר התאמה סופית עד שיושלם',
          )
          p.write_text(s)
          PY

      - name: Commit cleanup generated by this workflow
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup diff"
          else
            git config user.name "REMATCHER CI"
            git config user.email "actions@users.noreply.github.com"
            git add src/services/assistant/agent-tools.ts src/services/inventory/import.ts
            git commit -m "fix(agent): one asking price and feature amendments [skip ci]"
            git push origin HEAD:feat/final-ai-normalization-cleanup
          fi

      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        env:
          SKIP_DB_MIGRATIONS: "1"
        run: npx next build
