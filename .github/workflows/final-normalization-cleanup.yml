name: Final Normalization Cleanup

on:
  push:
    branches: [feat/final-ai-normalization-cleanup]

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-ai-normalization-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply final Agent/import product cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/services/assistant/agent-tools.ts')
          s = p.read_text()
          old_desc = 'Update the CURRENT conversational inventory draft with structured vehicle facts you understood from the user\'s message. Conversation state only — does NOT write to the database and does NOT require confirmation. Use when describing/correcting an unsaved vehicle. Only include facts actually stated or clearly corrected. Do not invent model/year/mileage/price.'
          new_desc = 'Update the CURRENT conversational inventory draft with structured vehicle facts you understood from the user\'s message. Conversation state only — does NOT write to the database and does NOT require confirmation. Use for initial facts AND follow-up corrections such as also has 4x4. Product semantics have ONE seller price: asking price. For features, use only canonical feature identifiers from the product vocabulary. Only include facts actually stated or clearly corrected.'
          if old_desc in s:
              s = s.replace(old_desc, new_desc)
          old_fields = '''            ownershipHand: nullableNumber,
            ownershipType: nullableString,
            retailPrice: nullableNumber,
            b2bPrice: nullableNumber,
            region: nullableString,'''
          new_fields = '''            ownershipHand: nullableNumber,
            ownershipType: nullableString,
            b2bPrice: nullableNumber,
            region: nullableString,
            fuelType: nullableString,
            engineDisplacementCc: nullableNumber,
            features: {
              type: ["array", "null"],
              items: { type: "string" },
            },'''
          if old_fields not in s:
              raise SystemExit('agent-tools expected inventory draft field block not found')
          s = s.replace(old_fields, new_fields)
          p.write_text(s)

          p = Path('src/services/inventory/import.ts')
          s = p.read_text()
          s = s.replace('מחיר סוחר חסר — לא תיווצר התאמה סופית עד שיושלם', 'מחיר מבוקש חסר — לא תיווצר התאמה סופית עד שיושלם')
          p.write_text(s)
          PY

      - name: Commit cleanup generated by this workflow
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup diff"
          else
            git config user.name "REMATCHER CI"
            git config user.email "actions@users.noreply.github.com"
            git add src/services/assistant/agent-tools.ts src/services/inventory/import.ts
            git commit -m "fix(agent): one asking price and feature amendments [skip ci]"
            git push origin HEAD:feat/final-ai-normalization-cleanup
          fi

      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        env:
          SKIP_DB_MIGRATIONS: "1"
        run: npx next build
